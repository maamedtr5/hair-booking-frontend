<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Book your next hair appointment at Locs Allure, Madina Estates, Accra." />
    <meta name="theme-color" content="#2c1a0e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Blocking (not type="module", not deferred) so this runs before
      // the page paints — must stay in sync with useTheme.ts's storage
      // key ('theme') and values ('light' | 'dark' | 'system').
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var resolved =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          // localStorage/matchMedia unavailable (private mode, old browser,
          // etc.) — falls through to the light-mode default in index.css.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    <title>Locs Allure</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
